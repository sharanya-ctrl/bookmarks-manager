<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bookmark manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>my bookmarks</h1>
    <div class="image">
         <img src="butterfly.png" alt="butterfly" width="200px">
         <p class="quote">It gets better.</p></div>
   
    <h2>primary bookmarks</h2>
    <ul>
            <li><a target="_blank" href="https://www.google.com">Google</a></li>
            <li><a target="_blank" href="https://www.leetcode.com">leetcode</a></li>
            <li><a target="_blank" href="https://www.github.com">github</a></li>
            <li><a target="_blank" href="https://www.whatsapp.com">whatsapp</a></li>
            <li><a target="_blank" href="https://www.hackerrank.com">hackerrank</a></li>
            <li><a target="_blank" href="https://gink-go-self-help-website.vercel.app/index.html">ginkGO</a></li>
          
    </ul>
    <h2>secondary bookmarks</h2>
    <ul>
        <li><a target="_blank" href="https://www.linkedin.com">linkedin</a></li>
        <li><a target="_blank" href="https://www.youtube.com">youtube</a></li>
    </ul>
     
</body>
</html>
